[package]
name = "mab-projets"
version = "1.0.0"
description = "MAB Projets — APH SELECT (Conseils Immobiliers MAB)"
authors = ["Marc-André Boucher"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
